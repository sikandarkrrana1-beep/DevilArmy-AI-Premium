<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>DevilArmy Premium</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#171717;--line:#632020;--red:#d71920;--text:#fff;--muted:#bbb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#291010 0,#090909 55%);color:var(--text);font-family:Arial,sans-serif}
    main{width:min(760px,100%);margin:0 auto}
    .card{width:100%;padding:22px;background:#171717;border:1px solid var(--line);border-radius:18px;box-shadow:0 0 28px #4b090933;margin:14px 0}
    h1,h2{color:#ff3030;margin-top:0}h1{text-align:center} .center{text-align:center}
    p,.muted{color:var(--muted);line-height:1.5}
    input,select,textarea,button{width:100%;padding:13px;margin-top:10px;border-radius:9px;font-size:16px}
    input,select,textarea{background:#101010;color:white;border:1px solid #444}
    textarea{min-height:90px;resize:vertical}
    button{border:0;background:var(--red);color:white;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.secondary{background:#333}.smallbtn{width:auto;padding:9px 12px}
    #message,#appStatus,#historyStatus{overflow-wrap:anywhere;line-height:1.5}
    #app,#account{display:none}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;margin-top:10px;color:#eee;font-size:14px}
    .result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;min-height:70px;padding:10px 0}
    .history-item{border:1px solid #444;border-radius:10px;padding:12px;margin:10px 0}
    .history-item p{white-space:pre-wrap;overflow-wrap:anywhere}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .topbar h1{margin:0;text-align:left}
    .topbar button{width:auto;margin:0}
    .note{font-size:12px;color:#999}
    @media(max-width:520px){body{padding:12px}.grid{grid-template-columns:1fr}.card{padding:16px}}
  </style>
</head>
<body>
<main>
  <section class="card" id="auth">
    <h1>DEVILARMY PREMIUM</h1>
    <p class="center">Secure Login • AI Shayari & Caption Generator</p>
    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password (कम से कम 8 अक्षर)" autocomplete="current-password" minlength="8" required>
      <button id="login" type="submit">Login</button>
      <button id="signup" type="button" class="secondary">Create Account</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section id="app" aria-live="polite">
    <div class="card topbar">
      <div><h1>DEVILARMY <span style="color:white">PREMIUM</span></h1><p style="margin-bottom:0">AI Shayari • Reels Captions • Hindi & Hinglish</p></div>
      <button id="logout" type="button" class="secondary">Logout</button>
    </div>
    <div class="card">
      <p>Login सफल ✅ <span id="userEmail"></span></p>
      <h2>AI Generator</h2>
      <label for="kind">क्या बनाना है?</label>
      <select id="kind">
        <option>Love Shayari</option>
        <option>Desi Attitude Dialogue</option>
        <option>Sad Feelings Shayari</option>
        <option>Motivational Shayari</option>
        <option>Instagram Reel Caption</option>
        <option>Facebook Post Caption</option>
        <option>Army / Fauji Respect Quote</option>
      </select>
      <div class="grid">
        <div><label for="lang">भाषा</label><select id="lang"><option value="Hindi">हिंदी</option><option value="Hinglish">Hinglish (Roman Hindi)</option></select></div>
        <div><label for="mood">स्टाइल</label><select id="mood"><option>Desi, natural, heart-touching</option><option>Short, catchy, trending reel style</option><option>Attitude, confident, respectful</option><option>Emotional but hopeful</option><option>Romantic, sweet, respectful</option><option>Motivational, energetic, original</option></select></div>
      </div>
      <label for="topic">विषय (ज़रूरी)</label>
      <textarea id="topic" maxlength="300" placeholder="जैसे: सच्चा प्यार, फौजी की ड्यूटी, दोस्ती, मेहनत, देसी स्वैग…" required></textarea>
      <div class="grid">
        <div><label for="length">लंबाई</label><select id="length"><option value="2-4 short lines">Short (2–4 lines)</option><option value="4-8 lines">Medium (4–8 lines)</option><option value="one punchy line">One-line caption</option></select></div>
        <div><label for="count">वर्ज़न</label><select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
      </div>
      <button id="generate" type="button">✨ AI से बनाओ</button>
      <p id="appStatus" role="status" aria-live="polite"></p>
      <p class="note">API key इस पेज पर न डालें। Gemini key Cloudflare Worker Secret में ही रखें।</p>
    </div>
    <div class="card">
      <h2>तुम्हारा रिज़ल्ट</h2>
      <div id="result" class="result"></div>
      <div class="grid"><button id="copy" type="button" class="secondary">📋 टेक्स्ट कॉपी</button><button id="again" type="button" class="secondary">🔄 फिर से बनाओ</button></div>
    </div>
    <div class="card">
      <div class="topbar"><h2 style="margin:0">My Generation History</h2><button id="loadHistory" type="button" class="secondary smallbtn">Refresh</button></div>
      <p id="historyStatus" role="status" aria-live="polite"></p>
      <div id="historyList"></div>
    </div>
  </section>
</main>

<script>
(() => {
  // Supabase Project URL and Publishable key. Never put a service_role/secret key here.
  const SUPABASE_URL = "https://fxqcdjsodzgfddfhtmez.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VeZ2VRgTNOfPyKXDNAB9sg_6lSfrkev";

  // This Worker must implement authenticated POST /generate and GET /history routes.
  const WORKER_URL = "https://devilarmy-ai.sikandarkrana1.workers.dev";

  const $ = id => document.getElementById(id);
  const authSection = $("auth");
  const appSection = $("app");
  const message = $("message");
  const appStatus = $("appStatus");
  const historyStatus = $("historyStatus");
  const historyList = $("historyList");
  let client;
  let busy = false;

  function authMessage(text){ message.textContent = text; }
  function appMessage(text){ appStatus.textContent = text; }

  function setBusy(value) {
    busy = value;
    ["login","signup","logout","generate","again","loadHistory"].forEach(id => {
      const el = $(id);
      if (el) el.disabled = value;
    });
  }

  function showSession(session) {
    const loggedIn = Boolean(session && session.user);
    authSection.style.display = loggedIn ? "none" : "block";
    appSection.style.display = loggedIn ? "block" : "none";
    $("userEmail").textContent = loggedIn ? "— " + (session.user.email || "") : "";
    if (!loggedIn) {
      $("result").textContent = "";
      historyList.replaceChildren();
      historyStatus.textContent = "";
    }
  }

  async function getSession() {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;
    if (!data.session) throw new Error("पहले Login करो।");
    return data.session;
  }

  async function workerRequest(path, options = {}) {
    const session = await getSession();
    const response = await fetch(WORKER_URL + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token,
        ...(options.headers || {})
      },
      cache: "no-store"
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Request असफल हुआ (" + response.status + ")");
    return data;
  }

  async function signUp() {
    if (busy) return;
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || password.length < 8) {
      authMessage("सही Email और कम से कम 8 अक्षर का Password भरें।");
      return;
    }
    setBusy(true);
    authMessage("Account बनाया जा रहा है...");
    try {
      const { data, error } = await client.auth.signUp({
        email, password,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if (error) throw error;
      if (data.session) authMessage("Account बन गया और Login सफल!");
      else authMessage("Account बन गया। Email confirmation link खोलकर फिर Login करें।");
    } catch (e) {
      authMessage("Sign Up Error: " + (e.message || "कृपया फिर कोशिश करें।"));
    } finally { setBusy(false); }
  }

  async function login(event) {
    if (event) event.preventDefault();
    if (busy) return;
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      authMessage("Email और Password दोनों भरें।");
      return;
    }
    setBusy(true);
    authMessage("Login हो रहा है...");
    try {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      authMessage("Login सफल!");
    } catch (e) {
      authMessage("Login Error: " + (e.message || "कृपया फिर कोशिश करें।"));
    } finally { setBusy(false); }
  }

  async function logout() {
    if (busy) return;
    setBusy(true);
    try {
      const { error } = await client.auth.signOut();
      if (error) throw error;
      authMessage("आप Logout हो गए हैं।");
      showSession(null);
    } catch (e) {
      appMessage("Logout Error: " + (e.message || "फिर कोशिश करें।"));
    } finally { setBusy(false); }
  }

  function categoryKind(selected) {
    if (selected.includes("Caption")) return "caption";
    if (selected.includes("Dialogue")) return "dialogue";
    return "shayari";
  }

  async function generate() {
    if (busy) return;
    const topic = $("topic").value.trim();
    if (topic.length < 2) {
      appMessage("पहले विषय लिखो, जैसे प्यार, दोस्ती या मोटिवेशन।");
      $("topic").focus();
      return;
    }
    setBusy(true);
    appMessage("AI तुम्हारा टेक्स्ट बना रहा है…");
    $("result").textContent = "";
    try {
      const selected = $("kind").value;
      const data = await workerRequest("/generate", {
        method: "POST",
        body: JSON.stringify({
          kind: categoryKind(selected),
          category: selected,
          language: $("lang").value,
          mood: $("mood").value,
          topic,
          length: $("length").value,
          count: Number($("count").value)
        })
      });
      $("result").textContent = data.text || "कोई टेक्स्ट नहीं मिला।";
      appMessage("हो गया! तुम्हारा टेक्स्ट तैयार है।");
      await loadHistory(false);
    } catch (e) {
      appMessage("समस्या: " + (e.message || "कनेक्शन नहीं हो पाया।"));
    } finally { setBusy(false); }
  }

  async function loadHistory(showLoading = true) {
    if (showLoading) historyStatus.textContent = "History लोड हो रही है...";
    historyList.replaceChildren();
    try {
      const data = await workerRequest("/history", { method: "GET" });
      const items = Array.isArray(data.history) ? data.history : [];
      if (!items.length) {
        historyStatus.textContent = "अभी कोई History नहीं है।";
        return;
      }
      historyStatus.textContent = items.length + " हाल की Generations";
      for (const item of items) {
        const card = document.createElement("article");
        card.className = "history-item";
        const title = document.createElement("strong");
        title.textContent = (item.category || "Generation") + " · " + (item.language || "");
        const content = document.createElement("p");
        content.textContent = item.content || "";
        const date = document.createElement("small");
        date.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : "";
        card.append(title, content, date);
        historyList.appendChild(card);
      }
    } catch (e) {
      historyStatus.textContent = "History Error: " + (e.message || "लोड नहीं हो सकी।");
    }
  }

  async function copyResult() {
    const text = $("result").textContent.trim();
    if (!text) { appMessage("पहले टेक्स्ट जनरेट करो।"); return; }
    try {
      await navigator.clipboard.writeText(text);
      appMessage("टेक्स्ट कॉपी हो गया!");
    } catch {
      appMessage("कॉपी उपलब्ध नहीं है। टेक्स्ट को दबाकर चुनें और Copy करें।");
    }
  }

  async function init() {
    try {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      showSession(data.session);
      client.auth.onAuthStateChange((_event, session) => {
        showSession(session);
        if (session) {
          // Avoid making Supabase calls inside the auth callback itself.
          setTimeout(() => loadHistory(false), 0);
        }
      });
    } catch (e) {
      authMessage("सेटअप Error: " + (e.message || "Supabase कनेक्शन नहीं हुआ।"));
    }
  }

  $("authForm").addEventListener("submit", login);
  $("signup").addEventListener("click", signUp);
  $("logout").addEventListener("click", logout);
  $("generate").addEventListener("click", generate);
  $("again").addEventListener("click", generate);
  $("copy").addEventListener("click", copyResult);
  $("loadHistory").addEventListener("click", () => loadHistory(true));

  init();
})();
</script>
</body>
</html>
