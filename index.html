<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10101c">
<title>DevilArmy AI Premium</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#19192b;text-align:center;border-bottom:1px solid #33334c}
header h1{margin:0;color:#b9a0ff;font-size:25px}
header p{color:#bbb;margin-bottom:0}
main{max-width:650px;margin:auto;padding:18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{cursor:pointer;border:0;border-radius:10px;padding:13px 8px;font-weight:bold}
.tab{background:#25253b;color:white}
.tab.active{background:#7958ed}
.panel{margin-top:18px;background:#19192b;padding:17px;border-radius:15px}
h2{font-size:20px;margin-top:0}
input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #454560;background:#10101c;color:white;font-size:16px;margin:8px 0}
textarea{resize:vertical;min-height:95px}
.action{width:100%;background:#7958ed;color:white;margin-top:8px;font-size:16px}
.result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin-top:14px}
a{color:#b9a0ff}
.note{color:#bbb;font-size:13px;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>⚡ DevilArmy AI Premium</h1>
<p>Your AI Assistant • Search • YouTube</p>
</header>
<main>
<div class="tabs">
<button class="tab active" data-panel="chat">🤖 AI Chat</button>
<button class="tab" data-panel="google">🌐 Google</button>
<button class="tab" data-panel="youtube">▶️ YouTube</button>
</div>

<section class="panel" id="chat">
<h2>AI से सवाल पूछें</h2>
<textarea id="question" placeholder="अपना सवाल हिंदी या English में लिखें..."></textarea>
<button class="action" id="ask">AI से जवाब पूछें</button>
<div class="result" id="answer" aria-live="polite"></div>
<p class="note">AI जवाब पाने के लिए सुरक्षित Backend अगले स्टेप में जोड़ा जाएगा।</p>
</section>

<section class="panel" id="google" hidden>
<h2>Google Search</h2>
<form id="googleForm">
<input id="googleQuery" placeholder="क्या खोजना चाहते हैं?" required>
<button class="action">Google पर खोजें</button>
</form>
</section>

<section class="panel" id="youtube" hidden>
<h2>YouTube Videos</h2>
<form id="youtubeForm">
<input id="youtubeQuery" placeholder="वीडियो का नाम लिखें" required>
<button class="action">वीडियो खोजें</button>
</form>
<div id="videos" class="result"></div>
</section>
</main>
<script>
const tabs=document.querySelectorAll(".tab");
tabs.forEach(button=>{
  button.addEventListener("click",()=>{
    tabs.forEach(t=>t.classList.toggle("active",t===button));
    document.querySelectorAll("main section").forEach(section=>{
      section.hidden=section.id!==button.dataset.panel;
    });
  });
});
document.getElementById("googleForm").addEventListener("submit",e=>{
  e.preventDefault();
  const q=document.getElementById("googleQuery").value.trim();
  if(q) window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank","noopener");
});
document.getElementById("youtubeForm").addEventListener("submit",e=>{
  e.preventDefault();
  const q=document.getElementById("youtubeQuery").value.trim();
  if(!q)return;
  const url="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
  const link=document.createElement("a");
  link.href=url;link.target="_blank";link.rel="noopener";
  link.textContent="▶ YouTube पर वीडियो देखें";
  const videos=document.getElementById("videos");
  videos.replaceChildren(link);
});
document.getElementById("ask").addEventListener("click",()=>{
  const q=document.getElementById("question").value.trim();
  const answer=document.getElementById("answer");
  answer.textContent=q
    ?"AI Backend अभी कनेक्ट नहीं हुआ है। अगले स्टेप में इसे सुरक्षित तरीके से जोड़ेंगे।"
    :"पहले अपना सवाल लिखें।";
});
</script>
</body>
</html>
